{% extends 'index.html'%}
{% block content %}

<section class="page-title bg-1">
    <div class="overlay"></div>
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="block text-center">
            <span class="text-white"></span>
            <h1 class="text-capitalize mb-5 text-lg">REGISTRATION</h1>
  
            <!-- <ul class="list-inline breadcumb-nav">
              <li class="list-inline-item"><a href="index.html" class="text-white">Home</a></li>
              <li class="list-inline-item"><span class="text-white">/</span></li>
              <li class="list-inline-item"><a href="#" class="text-white-50">Contact Us</a></li>
            </ul> -->
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- contact form start -->
  
  
  
  <section class="contact-form-wrap section">
      <div class="container">
          <div class="row justify-content-center">
              <div class="col-lg-6">
                  <div class="section-title text-center">
                      <h2 class="text-md mb-2">Registration</h2>
                      <div class="divider mx-auto my-4"></div>
                      <p class="mb-5"></p>
                  </div>
              </div>
          </div>
          <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12">
                  <form  method="post" action="/user_register/" onsubmit="return validateForm()">
                   <!-- form message -->
                   {% csrf_token %}
                      <div class="row">
                          <div class="col-12">
                              <div class="alert alert-success contact__msg" style="display: none" role="alert">
                                  Your message was sent successfully.
                              </div>
                          </div>
                      </div>
  
                      <div class="row">
                          <div class="col-lg-6">
                              <div class="form-group">
                                  <input name="name" id="name" type="text" class="form-control" name=name placeholder="Your Full Name" required>
                              </div>
                          </div>
  
                          <div class="col-lg-6">
                              <div class="form-group">
                                  <input name="email" id="email" type="email" class="form-control" name="email" placeholder="Your Email Address" required>
                              </div>
                          </div>
                           <div class="col-lg-6">
                              <div class="form-group">
                                  <input name="pswd" id="pswd" type="password" class="form-control" name="pswd" placeholder="Password" pattern=".{6,}" title="Password must be at least 6 characters" required>
                              </div>
                          </div>
                           <div class="col-lg-6">
                              <div class="form-group">
                                  <input name="phn" id="phn" type="tel" class="form-control" name="phn" placeholder="Your Phone Number" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" required>
                              </div>
                          </div>
                    
                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="uname" id="uname" type="text" class="form-control" name="uname" placeholder="User Name" pattern="[a-zA-Z0-9]+" title="Please enter only letters and numbers" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="adrs" id="adrs" type="text" class="form-control" name="adrs" placeholder="Your Address" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="plc" id="plc" type="text" class="form-control" name="plc" placeholder="Place" required>
                            </div>
                        </div>
                    
                        <div class="col-lg-6">
                            <div class="form-group">
            
                                <input name="age" id="age" type="number" class="form-control" name="age" placeholder="Age" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
            
                                <input name="weight" id="weight" type="number" class="form-control" name="weight" placeholder="Weight" required >
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
            
                                <input name="height" id="height" type="number" class="form-control" name="height" placeholder="height" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                
                                <label for="bldgrp">Blood group:</label>
                                <select name="bldgrp" id="bldgrp" class="form-control">
                                    <option value="A+ve">A+ve</option>
                                    <option value="A-ve">A-ve</option>
                                    <option value="B+ve">B+ve</option>
                                    <option value="B-ve">B-ve</option>
                                    <option value="AB+ve">AB+ve</option>
                                    <option value="AB-ve">AB-ve</option>
                                    <option value="O+ve">O+ve</option>
                                    <option value="O-ve">O-ve</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label for="gender">Gender:</label>
                                    <select name="gender" id="gender" class="form-control">
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                    </select>
                            </div>
                        </div>
                      </div>
                


                
                        <div class="text-center">
                            <button class="btn btn-main btn-round-full" type="submit">Submit</button>
                        </div>
                 
                    
                    
                    
                  </form>
                  <script>
                    function validateForm() {
                        // Validate phone number
                        var phn = document.getElementById("phn");
                        if (!/^\d{10}$/.test(phn.value)) {
                            alert("Please enter a valid 10-digit phone number");
                            return false;
                        }
                
                        // Additional validation for other fields can be added here
                
                        return true;
                    }
                </script>
              </div>
          </div>
      </div>
  </section>
{%endblock%}

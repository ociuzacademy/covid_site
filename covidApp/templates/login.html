{% extends 'index.html'%}
{% block content %}

<section class="page-title bg-1">
    <div class="overlay"></div>
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="block text-center">
            <span class="text-white"></span>
            <h1 class="text-capitalize mb-5 text-lg">LOGIN</h1>
  
            <!-- <ul class="list-inline breadcumb-nav">
              <li class="list-inline-item"><a href="index.html" class="text-white">Home</a></li>
              <li class="list-inline-item"><span class="text-white">/</span></li>
              <li class="list-inline-item"><a href="#" class="text-white-50">Contact Us</a></li>
            </ul> -->
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- contact form start -->
  
  
  </section>
  
  <section class="contact-form-wrap section">
      <div class="container">
          <div class="row justify-content-center">
              <div class="col-lg-6">
                  <div class="section-title text-center">
                      <h2 class="text-md mb-2">Login Here</h2>
                      <div class="divider mx-auto my-4"></div>
                      <p class="mb-5"></p>
                  </div>
              </div>
          </div>
          <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12">
                  <form  method="post" action="/login/">
                   <!-- form message -->
                   {% csrf_token %}
                      <div class="row">
                          <div class="col-12">
                              <div class="alert alert-success contact__msg" style="display: none" role="alert">
                                  Your message was sent successfully.
                              </div>
                          </div>
                      </div>
  
                
  
                          <div class="col-lg-6">
                              <div class="form-group">
                                  <input name="email" id="email" type="email" class="form-control" name="email" placeholder="Your Email Address">
                              </div>
                          </div>
                           <div class="col-lg-6">
                              <div class="form-group">
                                  <input name="pswd" id="pswd" type="password" class="form-control" name="pswd" placeholder="Password">
                              </div>
                          </div>
                         
                      </div>
                


                
                        <div class="text-center">
                            <button class="btn btn-main btn-round-full" type="submit">Submit</button>
                        </div>
                 
                    
                    
                    
                  </form>
              </div>
          </div>
      </div>
  </section>
{%endblock%}

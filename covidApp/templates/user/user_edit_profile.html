{% extends 'user/user_home.html' %}
{% block content %}

<section class="page-title bg-1">
    <div class="overlay"></div>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="block text-center">
                    <h1 class="text-capitalize mb-5 text-lg">Edit Profile</h1>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="contact-form-wrap section">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="section-title text-center">
                    <h2 class="text-md mb-2">Edit Profile</h2>
                    <div class="divider mx-auto my-4"></div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12">

                <form method="post" action="/user_edit_profile/">

                    {% csrf_token %}

                    {% for i in data %}

                    <div class="row">

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="name" id="name" type="text"
                                    class="form-control"
                                    value="{{i.name}}"
                                    placeholder="Your Full Name">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="uname" id="uname" type="text"
                                    class="form-control"
                                    value="{{i.uname}}"
                                    placeholder="User Name">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="email" id="email" type="email"
                                    class="form-control"
                                    value="{{i.email}}"
                                    placeholder="Your Email Address">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="pswd" id="pswd" type="password"
                                    class="form-control"
                                    value="{{i.pswd}}"
                                    placeholder="Password">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="phn" id="phn" type="tel"
                                    class="form-control"
                                    value="{{i.phn}}"
                                    placeholder="Phone Number">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="adrs" id="adrs" type="text"
                                    class="form-control"
                                    value="{{i.adrs}}"
                                    placeholder="Address">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="plc" id="plc" type="text"
                                    class="form-control"
                                    value="{{i.plc}}"
                                    placeholder="Place">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="age" id="age" type="text"
                                    class="form-control"
                                    value="{{i.age}}"
                                    placeholder="Age">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <select name="gender" id="gender" class="form-control">
                                    <option value="male" {% if i.gender == 'male' %}selected{% endif %}>Male</option>
                                    <option value="female" {% if i.gender == 'female' %}selected{% endif %}>Female</option>
                                    <option value="other" {% if i.gender == 'other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                        </div>

                        <!-- <div class="col-lg-6">
                            <div class="form-group">
                                <input name="status" id="status" type="text"
                                    class="form-control"
                                    value="{{i.status}}"
                                    placeholder="Status">
                            </div>
                        </div> -->

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="bldgrp" id="bldgrp" type="text"
                                    class="form-control"
                                    value="{{i.bldgrp}}"
                                    placeholder="Blood Group">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="weight" id="weight" type="text"
                                    class="form-control"
                                    value="{{i.weight}}"
                                    placeholder="Weight">
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                <input name="height" id="height" type="text"
                                    class="form-control"
                                    value="{{i.height}}"
                                    placeholder="Height">
                            </div>
                        </div>

                    </div>

                    <div class="text-center">
                        <button class="btn btn-main btn-round-full" type="submit">
                            Update Profile
                        </button>
                    </div>

                    {% endfor %}

                </form>

            </div>
        </div>

    </div>
</section>

{% endblock %}

{% extends 'user/user_home.html' %}
{% block content%}



<section class="page-title bg-1">
    <div class="overlay"></div>
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="block text-center">
            <span class="text-white"></span>
            <h1 class="text-capitalize mb-5 text-lg">Upload Covid data</h1>
  
            <!-- <ul class="list-inline breadcumb-nav">
              <li class="list-inline-item"><a href="index.html" class="text-white">Home</a></li>
              <li class="list-inline-item"><span class="text-white">/</span></li>
              <li class="list-inline-item"><a href="#" class="text-white-50">Contact Us</a></li>
            </ul> -->
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- contact form start -->
  
  
  </section>
  
  <section class="contact-form-wrap section">
      <div class="container">
          <div class="row justify-content-center">
              <div class="col-lg-6">
                  <div class="section-title text-center">
                      <h2 class="text-md mb-2">Covid Data:</h2>
                      <div class="divider mx-auto my-4"></div>
                      <p class="mb-5"></p>
                  </div>
              </div>
          </div>
          <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12">
                
                  <form  method="post"  action="/user_upload_coviddetails/" enctype="multipart/form-data">
                   <!-- form message -->
                   {% csrf_token %}
                      <div class="row">
                          <div class="col-12">
                              <div class="alert alert-success contact__msg" style="display: none" role="alert">
                                  Your message was sent successfully.
                              </div>
                          </div>
                      </div>
  
                    {% for i in user_data %}
  
                      <div class="row">
                        <div class="col-lg-6">
                            <div class="form-group">
                                Name:
                                <input name="name" id="name" type="text" class="form-control" value="{{i.name}}"  placeholder="Your Full Name" disabled >
                            </div>
                        </div>
                    {% endfor%}
                        <div class="col-lg-6">
                            <div class="form-group">
                                Date Of Xray:
                                <input type="date" name="doxray" id="doxray" class="form-control"  placeholder="Date Of xray" required>
                            </div>
                        </div>
                         <div class="col-lg-6">
                            <label for="effected">Effected before:</label>
                            <select name="effected" id="effected" class="form-control">
                                <option value="yes">Yes</option>
                                <option value="no">No</option>
                            </select>
                        </div>
                         <div class="col-lg-6">
                            <div class="form-group">
                                <label for="symptoms">Symptoms:</label>
                                <textarea name="symptoms" id="symptoms" rows="10" class="form-control" placeholder="Enter symptoms here" required></textarea>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label for="xray_image">Upload X-ray Image:</label>
                                <input type="file" name="xray_image" id="xray_image" accept="image/*" required>
                            </div>
                        </div>
              
                      <div class="text-center">
                        <input type="submit" value="Submit" class="btn btn-success w-55 py-6">                

                      </div>
                      <div class="col-lg-6">
                        <div class="form-group">
                            <!-- Add this to your HTML template where you want to display the prediction result -->
                            <!-- <p><h3>
                                Result: {{ user_coviddetails.covid_result }}</p>
                            </h3>  -->
                        </div>
                    </div>
                    
                        
                        
                      
                      
                  
                  
                      {% comment %} {% endfor %} {% endcomment %}
             
                       
                 
                    
                    
                    
                  </form>
              </div>
          </div>
      </div>
  </section>

{% endblock %}

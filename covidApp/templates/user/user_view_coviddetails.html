{% extends 'user/user_home.html' %}
{% block content%}

<section class="page-title bg-1">
    <div class="overlay"></div>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="block text-center">
                    <span class="text-white"></span>
                    <h1 class="text-capitalize mb-5 text-lg">Result</h1>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="contact-form-wrap section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="section-title text-center">
                    <h2 class="text-md mb-2">Covid Result:</h2>
                    <div class="divider mx-auto my-4"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12">
                <div class="form-group text-center" >
                    <!-- Display the prediction result here -->
                    {% for coviddetail in data %}
                        <p><h3>Covid Result: {{ coviddetail.covid_result }}</h3></p>
                        <p><h3>Tested Prediction Date: {{ coviddetail.prediction_date }}</h3></p>
                    {% endfor %}
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-6 col-sm-6">
                <div class="form-group text-center">
                    <!-- Display the uploaded X-ray image -->
                    {% for coviddetail in data %}
                        <img src="{{ coviddetail.xray_image.url }}" alt="X-ray Image" style="max-width: 100%;">
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}

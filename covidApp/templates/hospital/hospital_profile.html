{% extends 'hospital/hospital_home.html' %}
{% block content%}


<section class="page-title bg-1">
    <div class="overlay"></div>
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="block text-center">
            <span class="text-white"></span>
            <h1 class="text-capitalize mb-5 text-lg">Profile</h1>
  
            <!-- <ul class="list-inline breadcumb-nav">
              <li class="list-inline-item"><a href="index.html" class="text-white">Home</a></li>
              <li class="list-inline-item"><span class="text-white">/</span></li>
              <li class="list-inline-item"><a href="#" class="text-white-50">Contact Us</a></li>
            </ul> -->
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- contact form start -->
  
  
  </section>
  
  <section class="contact-form-wrap section">
      <div class="container">
          <div class="row justify-content-center">
              <div class="col-lg-6">
                  <div class="section-title text-center">
                      <h2 class="text-md mb-2">Profile</h2>
                      <div class="divider mx-auto my-4"></div>
                      <p class="mb-5"></p>
                  </div>
              </div>
          </div>
          <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12">
                  <form  method="post" action="">
                   <!-- form message -->
                   {% csrf_token %}
                   {% for i in data %}
                      <div class="row">
                          <div class="col-12">
                              <div class="alert alert-success contact__msg" style="display: none" role="alert">
                                  Your message was sent successfully.
                              </div>
                          </div>
                      </div>
  
                
  
                      <div class="row">
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input name="name" id="name" type="text" class="form-control" name=name value="{{i.name}}"  placeholder="Your Full Name" disabled >
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="form-group">
                                    <label for="email">Email</label>
                                <input name="email" id="email" type="email" class="form-control" name="email" value="{{i.email}}"  placeholder="Your Email Address" disabled>
                            </div>
                        </div>
                         <div class="col-lg-6">
                            <div class="form-group">
                                    <label for="pswd">Password</label>
                                <input name="pswd" id="pswd" type="password" class="form-control" name="pswd" value="{{i.pswd}}"  placeholder="Password" disabled>
                            </div>
                        </div>
                         <div class="col-lg-6">
                            <div class="form-group">
                                    <label for="phn">Phone Number</label>
                                <input name="phn" id="phn" type="tel" class="form-control" name="phn" value="{{i.phn}}"  placeholder="Your Phone Number" disabled>
                            </div>
                        </div>
                  
                      <div class="col-lg-6">
                          <div class="form-group">
                                 <label for="uname">User Name</label>
                              <input name="uname" id="uname" type="text" class="form-control" name="uname" value="{{i.uname}}" placeholder="User Name" disabled>
                          </div>
                      </div>
                      <div class="col-lg-6">
                          <div class="form-group">
                                    <label for="gst">Address</label>
                              <input name="adrs" id="adrs" type="text" class="form-control" name="adrs" value="{{i.adrs}}"  placeholder="Your Address" disabled>
                          </div>
                      </div>
                      <div class="col-lg-6">
                          <div class="form-group">
                                    <label for="plc">Place</label>
                              <input name="plc" id="plc" type="text" class="form-control" name="plc" value="{{i.plc}}"  placeholder="Place" disabled>
                          </div>
                      </div>
                  
                      
                    </div>
              


              
                    <div class="text-center">
                        <td><a href="/hospital_edit_profile/?id={{i.id}}" class="btn btn-primary w-55 py-6">Edit</a></td>
                      </div>
               
                  
                  
                  
                      {% endfor %}
             
                       
                 
                    
                    
                    
                  </form>
              </div>
          </div>
      </div>
  </section>

{% endblock %}
